; Posture-triage control unit firmware (ESP32 DOIT DevKit V1)
;
;   pio run -e esp32              build for the real harness
;   pio run -e esp32 -t upload    flash it
;   pio run -e esp32-sim -t upload   flash the SIMULATED build (no sensors needed)
;   pio test -e native            run the unit tests on the PC
;   pio device monitor            serial log at 115200 baud

[platformio]
default_envs = esp32

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:esp32]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
test_ignore = *

[env:esp32-sim]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DPT_SIMULATE=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-parameter
