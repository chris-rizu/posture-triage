# Builds an unsigned iPhone app (.ipa) on a GitHub-hosted Mac, so no Mac is needed.
# Run it from the repository's Actions tab ("Build iOS app" → Run workflow), then download
# PostureTriage-unsigned-ipa from the finished run. Sign and install it as described in docs/IOS.md.
name: Build iOS app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr PostureTriage-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PostureTriage-unsigned-ipa
          path: app/PostureTriage-unsigned.ipa
          retention-days: 30
